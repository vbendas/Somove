# =============================================================================
# Somove — Docker Compose (Self-Hosted)
# =============================================================================
# Usage:
#   1. Copy .env.example to .env and fill in values
#   2. Run: docker compose up -d
#   3. Open http://localhost:3000 and complete setup wizard
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Next.js Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: somove-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=http://kong:8000
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_SITE_URL=${SITE_URL:-http://localhost:3000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - DAILY_API_KEY=${DAILY_API_KEY:-}
      - DAILY_DOMAIN=${DAILY_DOMAIN:-}
      - MIROTALK_URL=${MIROTALK_URL:-}
      - MIROTALK_API_KEY=${MIROTALK_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CHATWOOT_ACCOUNT_ID=${CHATWOOT_ACCOUNT_ID:-}
      - CHATWOOT_API_TOKEN=${CHATWOOT_API_TOKEN:-}
      - CHATWOOT_BASE_URL=${CHATWOOT_BASE_URL:-}
      - NEXT_PUBLIC_CHATWOOT_WEBSITE_TOKEN=${CHATWOOT_WEBSITE_TOKEN:-}
      - NEXT_PUBLIC_CHATWOOT_BASE_URL=${CHATWOOT_BASE_URL:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_started

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: supabase/postgres:15.1.1.78
    container_name: somove-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      API_EXTERNAL_URL: ${SITE_URL:-http://localhost:3000}
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-this_password_is_insecure_and_should_be_changed}
    volumes:
      - ./supabase/volumes/db:/var/lib/postgresql/data
      - ./supabase/volumes/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kong API Gateway
  # ---------------------------------------------------------------------------
  kong:
    image: kong:2.8.1
    container_name: somove-kong
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_RESOLVER: 127.0.0.11
      KONG_NGINX_PROXY_PROXY_SET_HEADER: "X-Forwarded-For $proxy_add_x_forwarded_for"
    volumes:
      - ./supabase/volumes/api/kong.yml:/var/lib/kong/kong.yml
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # GoTrue (Auth)
  # ---------------------------------------------------------------------------
  auth:
    image: supabase/gotrue:v2.158.1
    container_name: somove-auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-supersecretpassword}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: ${SITE_URL:-http://localhost:3000}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "false"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ""
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ""
    ports:
      - "9999:9999"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # PostgREST (REST API)
  # ---------------------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: somove-rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-supersecretpassword}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------
  storage:
    image: supabase/storage-api:v1.11.13
    container_name: somove-storage
    restart: unless-stopped
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword}
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      IS_MULTITENANT: "false"
      PGRST_DB_SCHEMAS: storage,public
    volumes:
      - ./supabase/volumes/storage:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy
